services:
  backend:
    build: ./backend
    volumes:
      - snapshots:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
volumes:
  snapshots:
