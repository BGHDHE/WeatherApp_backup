services:
  backend:
    build: ./backend
    volumes:
      - snapshots:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles:
      - cloudflare

volumes:
  snapshots:
